# Publishes a release whenever main carries a version that has no tag yet.
#
# The version in gradle.properties is the only trigger, so a version bump synced from upstream is
# released as it is. A push that leaves the version alone does nothing past the first job. The notes
# use the version's dated CHANGELOG section when there is one, else Unreleased, else the commits since
# the previous tag; the CHANGELOG never holds a release back. patches-list.json has to match the
# bundle, which upstream keeps true with ./gradlew :patches:generatePatchCatalog.
#
# The bundle is built from the pushed commit, checked the way scripts/release/release.ps1 checks the
# bundle itself (.github/scripts/release_ci.py check), attested, and published with SHA256SUMS.txt.
# patches-bundle.json is then pointed at this repository's release in a commit of its own, so Morphe
# Manager picks the new bundle up. That commit is pushed with GITHUB_TOKEN, which never starts
# another workflow run. README.md and scripts/check_release.py are left as upstream has them.
#
# The build runs Gradle, its plugins and every dependency they pull, so it gets a token that can only
# read. It hands the bundle, the notes and the index to the publish job as an artifact. The publish
# job holds the write token and runs no code from the repository: it checks what it was handed,
# attests it, publishes it and commits patches-bundle.json. Neither job leaves a token in .git/config.
#
# No release receipt, no tests and no signature: the receipt applies a patch run to every Messenger
# build family, and the runner has neither the private stock APKs nor the release key.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, and never a half-finished one cancelled by the next push.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check for a new version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d '[:space:]')
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=gradle.properties::version '$version' isn't X.Y.Z"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released, so there is nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version has no tag yet, so it will be released." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build v${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read      # Morphe's Gradle plugin comes from GitHub Packages
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BUNDLE: patches-${{ needs.check.outputs.version }}.mpp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # checkPatchCatalog fails on a patches-list.json that names another version or other patches
      # than the bundle carries, and writes the evidence "release_ci.py check" reads below. gradlew
      # is run through bash: it isn't executable in git, and chmod would make the tree dirty.
      - name: Build the bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e -o pipefail
          bash ./gradlew :patches:buildAndroid :patches:checkPatchCatalog --no-configuration-cache --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          status=$?
          if [ "$status" -ne 0 ]; then
            # The failure as an annotation, so the run's summary page says why without the full log.
            python - "$RUNNER_TEMP/gradle.log" << 'EOF'
          import re, sys
          lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          start = next((i for i, l in enumerate(lines) if l.startswith("* What went wrong")), None)
          picked = lines[start:start + 40] if start is not None else []
          picked += ["", "... last lines ..."] + lines[-60:]
          text = "\n".join(picked)
          text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::error title=Gradle build failed::" + text)
          EOF
            exit "$status"
          fi

      - name: Check the bundle
        run: |
          python .github/scripts/release_ci.py check --version "$VERSION"
          test -z "$(git status --porcelain --untracked-files=no)" \
            || { echo "::error::The build changed tracked files, so the bundle wasn't built from the commit alone"; git status --short; exit 1; }
          mkdir -p out/dist
          cp "patches/build/libs/$BUNDLE" out/dist/
          (cd out/dist && sha256sum "$BUNDLE" > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # The index is written here, where repository code may run, with the build's time standing in
      # for created_at. The publish job puts the release's own publish time there.
      - name: Write the release notes and the index
        run: |
          python .github/scripts/release_ci.py notes --version "$VERSION" \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out out/notes.md
          python .github/scripts/release_ci.py index --version "$VERSION" \
            --repository "$GITHUB_REPOSITORY" --created "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --commit "$GITHUB_SHA" \
            --out out/patches-bundle.json

      - name: Hand the release to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish v${{ needs.check.outputs.version }}
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write     # the tag, the release and the index commit
      id-token: write     # signing the provenance attestation
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BUNDLE: patches-${{ needs.check.outputs.version }}.mpp
      ASSETS: patches-${{ needs.check.outputs.version }}.mpp   # every file in dist/ but SHA256SUMS.txt
    steps:
      # Only for the commit that follows: nothing from the checkout runs in this job.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Receive the release from the build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: ${{ runner.temp }}/release

      # The build job ran code this job doesn't trust with the write token, so what it handed over is
      # held to the shape this release must have before anything is published or committed.
      - name: Check what the build job handed over
        run: |
          cd "$RUNNER_TEMP/release"
          listed() { LC_ALL=C sort | tr '\n' ' '; }
          files=$(find . -type f | listed)
          expected=$({ for asset in $ASSETS SHA256SUMS.txt; do echo "./dist/$asset"; done; echo ./notes.md; echo ./patches-bundle.json; } | listed)
          [ "$files" = "$expected" ] || { echo "::error::Unexpected release files: $files"; exit 1; }
          [ "$(cut -d' ' -f3- dist/SHA256SUMS.txt | listed)" = "$(printf '%s\n' $ASSETS | listed)" ] \
            || { echo "::error::SHA256SUMS.txt names other files than $ASSETS"; exit 1; }
          (cd dist && sha256sum -c SHA256SUMS.txt)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$BUNDLE"
          jq -e --arg version "$VERSION" --arg url "$url" --slurpfile current "$GITHUB_WORKSPACE/patches-bundle.json" \
            '.version == $version and .download_url == $url and (keys == ($current[0] | keys))
             and ([.[] | type] | all(. == "string"))' patches-bundle.json > /dev/null \
            || { echo "::error::patches-bundle.json from the build doesn't point at v$VERSION of this repository"; exit 1; }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/dist/${{ env.BUNDLE }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/release/notes.md" \
            $(for asset in $ASSETS SHA256SUMS.txt; do echo "$RUNNER_TEMP/release/dist/$asset"; done)
          # Download what was published and hold it to the local checksums.
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/hosted"
          (cd "$RUNNER_TEMP/hosted" && sha256sum -c SHA256SUMS.txt)

      - name: Point Manager at the new bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          index="$RUNNER_TEMP/release/patches-bundle.json"
          created=$(gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)
          # The format the index has always used: UTC, to the second, no zone suffix.
          created=${created%Z}
          created=${created:0:19}
          sed -i -E "s/^(  \"created_at\": \")[^\"]*(\",?)$/\1$created\2/" "$index"
          jq -e --arg created "$created" '.created_at == $created' "$index" > /dev/null \
            || { echo "::error::Couldn't set created_at to $created"; exit 1; }
          # The token goes on each command that needs it rather than into .git/config.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth#AUTHORIZATION: basic }"
          git -c "http.https://github.com/.extraheader=$auth" fetch origin main
          git checkout -B main origin/main
          cp "$index" patches-bundle.json
          if git diff --quiet -- patches-bundle.json; then
            echo "patches-bundle.json already points at v$VERSION."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(release): point Manager to the v$VERSION bundle" -- patches-bundle.json
          git -c "http.https://github.com/.extraheader=$auth" push origin main
          echo "Manager source: https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/patches-bundle.json" | tee -a "$GITHUB_STEP_SUMMARY"
